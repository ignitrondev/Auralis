name: Build and publish APK

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing tag to build and publish (for example v2.0.0-beta.1)
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: apk-release-${{ inputs.release_tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  build-and-release:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out tagged source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag || github.ref }}

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Prepare release signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          : "${ANDROID_KEYSTORE_BASE64:?Add the ANDROID_KEYSTORE_BASE64 repository secret}"
          key_path="$RUNNER_TEMP/auralis-release.jks"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$key_path"
          echo "ANDROID_KEYSTORE_PATH=$key_path" >> "$GITHUB_ENV"

      - name: Build signed release APK
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
        run: |
          set -euo pipefail
          : "${ANDROID_KEYSTORE_PASSWORD:?Add the ANDROID_KEYSTORE_PASSWORD repository secret}"
          : "${ANDROID_KEY_ALIAS:?Add the ANDROID_KEY_ALIAS repository secret}"
          : "${ANDROID_KEY_PASSWORD:?Add the ANDROID_KEY_PASSWORD repository secret}"
          if [[ "$RELEASE_TAG" != v* ]]; then
            echo "Release tag must start with v: $RELEASE_TAG" >&2
            exit 1
          fi
          version_name="${RELEASE_TAG#v}"
          ./gradlew :app:assembleRelease \
            -PauralisVersionName="$version_name" \
            -PauralisVersionCode="$GITHUB_RUN_NUMBER"
          mkdir -p release-assets
          apk_path="app/build/outputs/apk/release/app-release.apk"
          sdk_path="${ANDROID_HOME:-${ANDROID_SDK_ROOT:?Android SDK path is missing}}"
          apksigner="$(find "$sdk_path/build-tools" -type f -name apksigner -print -quit)"
          if [[ -z "$apksigner" ]]; then
            echo "Could not find apksigner in $sdk_path/build-tools" >&2
            exit 1
          fi
          "$apksigner" verify "$apk_path"
          cp "$apk_path" "release-assets/Auralis-$RELEASE_TAG.apk"

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
        run: |
          set -euo pipefail
          apk_path="release-assets/Auralis-$RELEASE_TAG.apk"
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "$apk_path" --repo "$GITHUB_REPOSITORY" --clobber
          elif [[ "$RELEASE_TAG" == *-* ]]; then
            gh release create "$RELEASE_TAG" "$apk_path" \
              --repo "$GITHUB_REPOSITORY" \
              --verify-tag \
              --prerelease \
              --title "Auralis $RELEASE_TAG" \
              --notes "Beta release of Auralis."
          else
            gh release create "$RELEASE_TAG" "$apk_path" \
              --repo "$GITHUB_REPOSITORY" \
              --verify-tag \
              --title "Auralis $RELEASE_TAG" \
              --notes "Auralis release."
          fi
